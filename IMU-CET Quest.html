<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>IMU-CET Quest</title><style>
:root{--bg:#f3f7fb;--c:#fff;--t:#0b2540;--m:#5b708a;--p:#0a6ebd;--g:#1e9e5a;--r:#d33f49;--bd:#d5e0ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#07182b;--c:#0e2a47;--t:#e8f1fb;--m:#9db2c9;--p:#4aa8ee;--g:#38c27c;--r:#f06a73;--bd:#1d4166}}
*{box-sizing:inherit}html,body{margin:0}body{background:var(--bg);color:var(--t);font:16px/1.45 system-ui,sans-serif;max-width:640px;margin:auto;padding:12px;user-select:none}
h1{font-size:20px;margin:4px 0}h2{font-size:17px}.row{display:flex;gap:8px;flex-wrap:wrap}.card,.b{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:12px;color:var(--t);font:inherit}
.b{cursor:pointer;text-align:left;width:100%;margin:5px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g .b{margin:0}.b small{display:block;color:var(--m)}
.pri{background:var(--p);color:#fff;border-color:var(--p);text-align:center}.ok{background:var(--g);color:#fff}.no{background:var(--r);color:#fff}
input,select,textarea{width:100%;padding:9px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--c);color:var(--t);font:inherit;user-select:text}
.meme{font-size:19px;font-weight:700;min-height:30px;margin:8px 0}.s{display:none}.s.on{display:block}.m{color:var(--m);font-size:13px}.bar{height:6px;background:var(--bd);border-radius:4px}.bar i{display:block;height:6px;background:var(--p);border-radius:4px}
</style></head><body oncontextmenu="return false">
<div class="row" style="justify-content:space-between;align-items:center"><h1>⚓ IMU-CET Quest</h1><div class="row"><button class="b" style="width:auto;margin:0" id="snd">🔊</button><button class="b" style="width:auto;margin:0" onclick="owner()">🔐 Owner</button></div></div>
<div id="home" class="s on"></div><div id="pick" class="s"></div><div id="play" class="s"></div><div id="res" class="s"></div><div id="info" class="s"></div><div id="own" class="s"></div>
<script>
"use strict";
const $=i=>document.getElementById(i),K="imuq_",LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(K+k))??d}catch(e){return d}},SV=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}};
const PINH="be87f203843cc46a6d5028b98f1b42a236260cc49551460b893091dec4cbf688",SALT="imu",MEMB="Narendra Modi|L|Uttar Pradesh|BJP~Amit Shah|L|Gujarat|BJP~Rajnath Singh|L|Uttar Pradesh|BJP~Nitin Gadkari|L|Maharashtra|BJP~Rahul Gandhi|L|Uttar Pradesh|INC~Akhilesh Yadav|L|Uttar Pradesh|SP~Omar Abdullah|L|Jammu and Kashmir|JKNC~Asaduddin Owaisi|L|Telangana|AIMIM~Supriya Sule|L|Maharashtra|NCP-SP~Shashi Tharoor|L|Kerala|INC~Hema Malini|L|Uttar Pradesh|BJP~Ravi Kishan|L|Uttar Pradesh|BJP~Kangana Ranaut|L|Himachal Pradesh|BJP~Sukhjinder Singh Randhawa|L|Punjab|INC~Manish Tewari|L|Punjab|INC~Kanimozhi Karunanidhi|L|Tamil Nadu|DMK~T. R. Baalu|L|Tamil Nadu|DMK~Abhishek Banerjee|L|West Bengal|AITC~G. Kishan Reddy|L|Telangana|BJP~Arjun Ram Meghwal|L|Rajasthan|BJP~Derek O'Brien|R|West Bengal|AITC~Sushmita Dev|R|West Bengal|AITC~Sanjay Raut|R|Maharashtra|SS(UBT)~Priyanka Chaturvedi|R|Maharashtra|SS(UBT)~Tiruchi Siva|R|Tamil Nadu|DMK~P. Chidambaram|R|Tamil Nadu|INC~Manoj Jha|R|Bihar|RJD~Kamal Haasan|R|Tamil Nadu|MNM";
const CMS="Andhra Pradesh|N. Chandrababu Naidu~Arunachal Pradesh|Pema Khandu~Assam|Himanta Biswa Sarma~Bihar|Samrat Choudhary~Chhattisgarh|Vishnu Deo Sai~Delhi|Rekha Gupta~Goa|Pramod Sawant~Gujarat|Bhupendra Patel~Haryana|Nayab Singh Saini~Himachal Pradesh|Sukhvinder Singh Sukhu~Jharkhand|Hemant Soren~Karnataka|D.K. Shivakumar~Kerala|V.D. Satheesan~Madhya Pradesh|Mohan Yadav~Maharashtra|Devendra Fadnavis~Manipur|Yumnam Khemchand Singh~Meghalaya|Conrad K. Sangma~Mizoram|P.U. Lalduhoma~Nagaland|Neiphiu Rio~Odisha|Mohan Charan Majhi~Punjab|Bhagwant Singh Mann~Rajasthan|Bhajan Lal Sharma~Sikkim|Prem Singh Tamang~Tamil Nadu|C. Joseph Vijay~Telangana|A. Revanth Reddy~Tripura|Manik Saha~Uttar Pradesh|Yogi Adityanath~Uttarakhand|Pushkar Singh Dhami~West Bengal|Suvendu Adhikari".split("~").map(x=>x.split("|"));
const MIN=[["Home Affairs","Amit Shah"],["Defence","Rajnath Singh"],["Finance","Nirmala Sitharaman"],["External Affairs","S. Jaishankar"],["Railways","Ashwini Vaishnaw"]];
const MEM=MEMB.split("~").map(x=>x.split("|"));
const BANK=`Geography|Largest ocean?|Pacific|Atlantic|Indian|Arctic~Geography|Tropic of Cancer passes through which state?|Gujarat|Kerala|Punjab|Tamil Nadu~Geography|Capital of Australia?|Canberra|Sydney|Melbourne|Perth~Geography|Strait between India and Sri Lanka?|Palk Strait|Malacca|Hormuz|Bering~Ocean|Deepest ocean trench?|Mariana Trench|Puerto Rico Trench|Java Trench|Tonga Trench~Ocean|Warm current along NW Europe?|Gulf Stream|Labrador|Benguela|Humboldt~Ocean|Average salinity of seawater?|35 ppt|3.5 ppt|350 ppt|0.35 ppt~Ocean|El Niño is warming of which ocean region?|Pacific|Atlantic|Indian|Arctic~Ocean|Instrument to measure ocean depth?|Echo sounder|Anemometer|Hygrometer|Barometer~Ship|Instrument measuring altitude of celestial body?|Sextant|Log|Gyro|Anemometer~Ship|AIS stands for?|Automatic Identification System|Automated Info Signal|Advanced Indicator System|Auto Interface Sensor~Ship|Left side of ship facing forward?|Port|Starboard|Aft|Bow~Ship|Plimsoll line shows?|Maximum safe loading|Speed|Fuel|Crew count~Ship|Gyrocompass points to?|True north|Magnetic north|Any pole|East~Ship|1 nautical mile =?|1852 m|1609 m|1000 m|2000 m~Ship|RADAR uses?|Radio waves|Sound waves|Visible light|X-rays~Ship|Anemometer measures?|Wind speed|Pressure|Humidity|Depth~Ship|Distress voice call?|Mayday|Pan-pan|Securite|Alpha~Ship|IMO headquarters?|London|Geneva|New York|Singapore~GK|Indian Maritime University HQ?|Chennai|Mumbai|Kochi|Vizag~GK|National Maritime Day (India)?|5 April|15 August|1 May|26 Jan~GK|Missile Man of India?|APJ Abdul Kalam|Homi Bhabha|Vikram Sarabhai|CV Raman~Physics|SI unit of force?|Newton|Joule|Pascal|Watt~Physics|Speed of light?|3×10⁸ m/s|3×10⁶ m/s|3×10⁵ m/s|3×10¹⁰ m/s~Physics|Archimedes principle concerns?|Buoyancy|Friction|Magnetism|Heat~Chemistry|Symbol of sodium?|Na|S|So|N~Chemistry|pH of pure water at 25°C?|7|0|14|1~Chemistry|Most abundant gas in air?|Nitrogen|Oxygen|CO₂|Argon~Maths|15% of 200?|30|20|25|35~Maths|d/dx of x²?|2x|x|x²|2~Maths|Angle sum of triangle?|180°|90°|270°|360°~Aptitude|100 m train at 36 km/h crosses a pole in?|10 s|5 s|3.6 s|36 s~Aptitude|SI on ₹1000 at 10% for 2 yrs?|₹200|₹100|₹210|₹20~Reasoning|2,4,8,16,?|32|24|30|20~Reasoning|Odd one: Triangle, Square, Circle, Cube|Cube|Triangle|Square|Circle~Sports|India's Olympic hockey golds?|8|6|7|9~Sports|Neeraj Chopra's Olympic gold event?|Javelin|Shot put|Discus|Hammer~Sports|India won first Cricket World Cup in?|1983|1975|1987|2011~Sports|Abhinav Bindra's 2008 gold sport?|Shooting|Wrestling|Boxing|Archery~Medals|First Indian woman Olympic medallist?|Karnam Malleswari|PT Usha|Mary Kom|Saina Nehwal~Medals|Manu Bhaker won two medals at?|Paris 2024|Tokyo 2020|Rio 2016|London 2012~Nobel|Tagore's Nobel field?|Literature|Peace|Physics|Chemistry~Nobel|CV Raman won Nobel for?|Raman effect|Photoelectric effect|Radioactivity|X-rays~Nobel|Mother Teresa's Nobel?|Peace|Literature|Medicine|Economics~Nobel|Amartya Sen's Nobel field?|Economics|Peace|Physics|Literature~Retired Leaders|Ram Nath Kovind was India's which President?|14th|13th|15th|12th~Retired Leaders|Pratibha Patil was first woman...|President of India|Prime Minister|Speaker|CJI`.split("~").map(x=>{const p=x.split("|");return{c:p[0],q:p[1],o:p.slice(2)}});
const CATS=[...new Set(BANK.map(x=>x.c)),"Parliament (MP)","Chief Ministers","Cabinet"];
const RIGHT=["Excellent! 🎉","Nice! You nailed it! 💪","Boom! Bullseye! 🎯","Captain material! ⚓","Smooth sailing! 🌊"],WRONG=["Better luck next time 😅","Oops! Rough seas 🌧️","Almost! Keep practising 📚","Wrong turn, sailor! 🧭","Don't worry, try again 💙"];
let snd=true,Q=[],i=0,sc=0,mode="",adm=false;
const rnd=a=>a[Math.random()*a.length|0],shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
function beep(ok){if(!snd)return;try{const C=new(window.AudioContext||window.webkitAudioContext)(),o=C.createOscillator(),g=C.createGain();o.connect(g);g.connect(C.destination);o.frequency.value=ok?740:180;o.type=ok?"sine":"sawtooth";g.gain.value=.15;o.start();o.stop(C.currentTime+(ok?.25:.4));if(ok){o.frequency.setValueAtTime(980,C.currentTime+.12)}}catch(e){}}
function say(t){if(!snd||!window.speechSynthesis)return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t.replace(/[^\w\s!',.]/g,"")))}
$("snd").onclick=()=>{snd=!snd;$("snd").textContent=snd?"🔊":"🔇"};
function show(s){document.querySelectorAll(".s").forEach(e=>e.classList.toggle("on",e.id==s));scrollTo(0,0)}
const all=()=>BANK.concat(LS("custom",[]));
function gen(cat){const o=[];
 if(cat=="Parliament (MP)"){MEM.forEach(m=>{const st=[...new Set(MEM.map(x=>x[2]))];if(st.length>3)o.push({c:cat,q:`${m[0]} (${m[3]}, ${m[1]=="L"?"Lok Sabha":"Rajya Sabha"}) belongs to which state?`,o:[m[2],...shuf(st.filter(s=>s!=m[2])).slice(0,3)]})})}
 if(cat=="Chief Ministers"){CMS.forEach(c=>o.push({c:cat,q:`Who is Chief Minister of ${c[0]}?`,o:[c[1],...shuf(CMS.filter(x=>x[1]!=c[1])).slice(0,3).map(x=>x[1])]}));CMS.forEach(c=>o.push({c:cat,q:`${c[1]} is CM of which state?`,o:[c[0],...shuf(CMS.filter(x=>x[0]!=c[0])).slice(0,3).map(x=>x[0])]}))}
 if(cat=="Cabinet"){MIN.forEach(m=>o.push({c:cat,q:`Union Minister for ${m[0]}?`,o:[m[1],...shuf(MIN.filter(x=>x[1]!=m[1])).slice(0,3).map(x=>x[1])]}))}
 return o}
const pool=cat=>cat=="Mixed"?all().concat(CATS.slice(-3).flatMap(gen)):CATS.slice(-3).includes(cat)?gen(cat):all().filter(q=>q.c==cat);
function home(){const paid=LS("paid",false);$("home").innerHTML=`<p class="m">Parliament, MLAs/CMs, ministers, geography, oceanography, ships &amp; more.</p>
<div class="g"><button class="b pri" onclick="daily()">📅 Daily 20<small>Mixed, new every day</small></button><button class="b" onclick="pk('free')">🎯 Practice<small>Up to 50 questions</small></button>
<button class="b" onclick="pk('chap')">📘 Chapter tests ${paid?"✅":"🔒"}<small>Paid</small></button><button class="b" onclick="pk('test')">📝 Test series ${paid?"✅":"🔒"}<small>₹${LS("price",299)} · up to 200 Qs</small></button>
<button class="b" onclick="cmlist()">🏛️ State CMs<small>All states</small></button><button class="b" onclick="elig()">🚢 Eligibility<small>IMU-CET, DNS, B.Sc, B.Tech</small></button></div>
<p class="m">Best score: ${LS("best",0)}. Question bank: ${all().length+CMS.length*2+MEM.length+MIN.length} questions.</p>`}
function pk(m){mode=m;if(m!="free"&&!LS("paid",false))return pay();
 $("pick").innerHTML=`<h2>${{free:"Practice",chap:"Chapter test",test:"Test series"}[m]}</h2>`+(m=="chap"?"":`<label class="m">Questions (max ${m=="test"?200:50})</label><input id="n" type="number" min="5" max="${m=="test"?200:50}" value="${m=="test"?100:20}">`)+
 ["Mixed",...CATS].map(c=>`<button class="b" onclick="go('${c}')">${c} <small>${pool(c).length} available</small></button>`).join("")+`<button class="b" onclick="home();show('home')">← Back</button>`;show("pick")}
function go(c){const mx=mode=="test"?200:50,n=Math.min(mx,+($("n")?$("n").value:20)||20);start(shuf(pool(c)).slice(0,mode=="chap"?25:n))}
function daily(){const d=new Date().toISOString().slice(0,10);let s=[...d].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);const r=()=>(s=Math.imul(s^s>>>15,2246822507)>>>0)/4294967296;
 const p=pool("Mixed").map(q=>[r(),q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).slice(0,20);mode="free";start(p)}
function start(l){if(!l.length){alert("No questions here yet.");return}Q=l.map(q=>({...q,o:shuf(q.o.map((t,k)=>({t,r:k==0})))}));i=0;sc=0;show("play");nq()}
function nq(){if(i>=Q.length)return end();const q=Q[i];$("play").innerHTML=`<div class="bar"><i style="width:${i/Q.length*100}%"></i></div><p class="m">${q.c} · Q${i+1}/${Q.length} · Score ${sc}</p><div class="card"><b>${q.q}</b></div>`+q.o.map((o,k)=>`<button class="b" onclick="ans(${k})">${o.t}</button>`).join("")+`<div class="meme" id="mm"></div><button class="b pri" id="nx" style="display:none" onclick="i++;nq()">Next →</button>`}
function ans(k){const q=Q[i];if(q.done)return;q.done=1;const ok=q.o[k].r,bs=$("play").querySelectorAll(".b:not(.pri)");bs.forEach((b,j)=>{if(q.o[j].r)b.classList.add("ok");else if(j==k)b.classList.add("no")});if(ok)sc++;const m=rnd(ok?RIGHT:WRONG);$("mm").textContent=m;beep(ok);say(m);$("nx").style.display="block";$("nx").textContent=i==Q.length-1?"Finish":"Next →"}
function end(){const p=Math.round(sc/Q.length*100);if(sc>LS("best",0))SV("best",sc);$("res").innerHTML=`<div class="card"><h2>Finished! ${p>=80?"🏆 Excellent!":p>=50?"👍 Nice effort!":"📚 Better luck next time!"}</h2><p>Score: <b>${sc}/${Q.length}</b> (${p}%)</p></div><button class="b pri" onclick="home();show('home')">Home</button>`;show("res");say(p>=50?"Well done":"Better luck next time")}
function pay(){const p=LS("price",299),cp=LS("cp",{}),d=LS("disc",0),f=Math.round(p*(100-d)/100);
 $("pick").innerHTML=`<h2>🔒 Test series &amp; chapter tests</h2><div class="card"><p>Includes full test series (up to 200 Qs per test) and chapter-wise tests.</p><p><b>Price: ₹${f}</b> ${d?`<s class="m">₹${p}</s> (${d}% off)`:""}</p><input id="cc" placeholder="Coupon code" autocapitalize="characters"><button class="b" onclick="coupon()">Apply coupon</button>
 ${f<=0?`<button class="b ok" onclick="SV('paid',true);SV('disc',0);home();show('home')">Unlock free</button>`:`<button class="b pri" onclick="payNow()">Pay ₹${f}</button>`}</div><button class="b" onclick="SV('disc',0);home();show('home')">← Back</button>`;show("pick")}
function coupon(){const c=$("cc").value.trim().toUpperCase(),cp=LS("cp",{});if(cp[c]!=null){SV("disc",cp[c]);pay();alert("Coupon applied: "+cp[c]+"% off")}else alert("Invalid coupon")}
function payNow(){const u=LS("upi","");alert(u?`Pay via UPI to ${u}, then send the receipt to the owner to get a 100% unlock code.`:"Online payment gateway is not connected yet. Ask the owner for an unlock coupon.")}
function cmlist(){$("info").innerHTML=`<h2>🏛️ State Chief Ministers</h2><p class="m">Verify with official sources; owner can update the list in code.</p>`+CMS.map(c=>`<div class="card" style="margin:4px 0"><b>${c[0]}</b><br>${c[1]}</div>`).join("")+`<button class="b" onclick="show('home')">← Back</button>`;show("info")}
function elig(){$("info").innerHTML=`<h2>🚢 Eligibility (approximate – verify on imu.edu.in / dgshipping.gov.in)</h2><div class="card"><p><b>B.Tech Marine Eng / Naval Arch (IMU-CET):</b> 10+2 with PCM ≥60% and English ≥50% (relaxation for SC/ST), age about 17–25.</p><p><b>B.Sc Nautical Science:</b> 10+2 PCM ≥60%, English ≥50%, age about 17–25, meets DG Shipping eyesight &amp; colour-vision fitness.</p><p><b>DNS (Diploma in Nautical Science):</b> 10+2 PCM ≥60%, English ≥50%, age about 17–25; usually sponsored by a shipping company.</p><p class="m">Merchant navy companies recruit cadets after DG Shipping-approved pre-sea training. Check each company's own criteria.</p></div><button class="b" onclick="show('home')">← Back</button>`;show("info")}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
let bad=0,lock=0;
async function owner(){if(adm)return panel();if(Date.now()<lock)return alert("Locked. Try again in a minute.");const p=prompt("Owner PIN");if(!p)return;if(await sha(SALT+p)==PINH){adm=true;bad=0;panel()}else if(++bad>=3){lock=Date.now()+60000;bad=0;alert("Too many attempts. Locked 1 min.")}else alert("Wrong PIN")}
function panel(){$("own").innerHTML=`<h2>🔐 Owner panel</h2><div class="card"><b>Add question</b><select id="oc">${CATS.slice(0,-3).map(c=>`<option>${c}</option>`).join("")}</select><textarea id="oq" placeholder="Question"></textarea><input id="o0" placeholder="Correct answer"><input id="o1" placeholder="Wrong 1"><input id="o2" placeholder="Wrong 2"><input id="o3" placeholder="Wrong 3"><button class="b pri" onclick="addQ()">Add</button></div>
<div class="card"><b>Bulk import / update (JSON)</b><p class="m">[{"c":"IMU-CET PYQ","q":"...","o":["correct","w1","w2","w3"]}] – first option is correct.</p><textarea id="oj" rows="5"></textarea><button class="b" onclick="imp()">Import</button><button class="b" onclick="exp()">Export JSON</button></div>
<div class="card"><b>Price &amp; coupons</b><input id="op" type="number" value="${LS("price",299)}" placeholder="Price"><input id="ou" value="${LS("upi","")}" placeholder="Your UPI ID"><input id="ok" placeholder="New coupon code"><input id="od" type="number" placeholder="Discount % (100 = free)"><button class="b" onclick="setP()">Save</button><p class="m">Coupons: ${Object.entries(LS("cp",{})).map(e=>e.join("=")+"%").join(", ")||"none"}</p></div>
<button class="b" onclick="if(confirm('Delete all custom questions?')){SV('custom',[]);panel()}">Delete custom questions (${LS("custom",[]).length})</button><button class="b" onclick="adm=false;home();show('home')">Log out</button>`;show("own")}
function addQ(){const o=[0,1,2,3].map(k=>$("o"+k).value.trim());if(!$("oq").value.trim()||o.some(x=>!x))return alert("Fill all fields");const c=LS("custom",[]);c.push({c:$("oc").value,q:$("oq").value.trim(),o});SV("custom",c);panel();alert("Added")}
function imp(){try{const a=JSON.parse($("oj").value);if(!Array.isArray(a)||a.some(x=>!x.q||!x.c||!x.o||x.o.length!=4))throw 0;SV("custom",LS("custom",[]).concat(a));panel();alert(a.length+" imported")}catch(e){alert("Invalid JSON format")}}
function exp(){$("oj").value=JSON.stringify(LS("custom",[]));}
function setP(){SV("price",+$("op").value||299);SV("upi",$("ou").value.trim());const k=$("ok").value.trim().toUpperCase(),d=+$("od").value;if(k&&d>0){const c=LS("cp",{});c[k]=Math.min(100,d);SV("cp",c)}panel()}
document.addEventListener("copy",e=>e.preventDefault());home();
</script></body></html>
